name: Build Umut AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını çıkar
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -o UmutAI_Android_APK_Kaynak_Projesi-1.zip -d extracted

      - name: Proje dosyalarını hazırla
        run: |
          ROOT=$(find extracted -name settings.gradle -type f -print -quit)
          if [ -z "$ROOT" ]; then
            echo "HATA: settings.gradle bulunamadı."
            exit 1
          fi
          DIR=$(dirname "$ROOT")
          cp -a "$DIR"/. .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK hazırla
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: APK oluştur
        run: gradle assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Umut-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
